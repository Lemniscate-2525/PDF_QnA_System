name: Validate productionization v2

on:
  push:
    branches: [productionization-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application
        run: python -m compileall -q app worker_entrypoint.py
      - name: Install lightweight test dependencies
        run: python -m pip install pytest redis numpy streamlit python-dotenv
      - name: Run isolated security tests
        run: pytest -q tests/test_security.py
